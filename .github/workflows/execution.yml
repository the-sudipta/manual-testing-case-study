name: Execution replay

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *" # nightly, 08:30 Bangladesh time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Replay executed test cases
        run: npm run execute
      - name: Rebuild workbooks, bug reports and charts from this run
        if: always()
        run: npm run report
      - name: Upload results and evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: execution-results
          path: |
            execution/results/run-results.json
            test-cases/*.xlsx
            bug-reports/evidence/
            reports/charts/
            playwright-report/
          retention-days: 14
      - name: Prepare Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report

  deploy:
    needs: replay
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
